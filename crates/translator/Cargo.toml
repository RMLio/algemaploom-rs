
[package]
name = "translator"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
lazy_static.workspace = true
regex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap.workspace = true

operator = { path = "../operator/" }
plan = { path = "../plan/" }
translator_api = { path = "../translator_api/" }
translator_rml = { path = "../translator_rml/" }
translator_new_rml = { path = "../translator_new_rml/" }
translator_shexml = { path = "../translator_shexml/" }
sparql-sat-checker = { path = "../sparql-sat-checker/" }

csv = "1.2.2"
urlencoding = "2.1.2"
walkdir = "2.4.0"
colored = "2.0.4"
log4rs.workspace = true
log.workspace = true
jni = { version = "0.21.1", optional = true }
neon = { version = "1.0.0", optional = true }
pyo3 = { version = "0.21.2", features = ["extension-module"], optional = true }
catch_panic = { git = "https://github.com/NULLx76/catch_panic.git" }

[lib]
name = "translator"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "translator-bin"
path = "src/bin/translator-bin/main.rs"


[[bin]]
name = "sparql-rml-pruner"
path = "src/bin/pruner-bin/main.rs"
